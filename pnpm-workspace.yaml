packages:
  - apps/desktop

nodeLinker: hoisted

# pdf.js only needs @napi-rs/canvas to rasterize in Node; Danesh renders pages in the renderer's own canvas.
ignoredOptionalDependencies:
  - "@napi-rs/canvas"

allowBuilds:
  esbuild: true
  node-llama-cpp: false
  onnxruntime-node: false
  electron-winstaller: false
  tesseract.js: false
  fsevents: false
  pnpm: false
